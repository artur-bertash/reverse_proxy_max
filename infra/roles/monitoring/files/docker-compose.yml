# Monitoring on the load generator: Prometheus (stores the numbers), Grafana (shows them) and
# node_exporter (the load generator's own CPU). Installed and started by Ansible (infra/roles/monitoring).
#
# Everything uses the host's network (network_mode: host) and listens on 127.0.0.1 only.
# Docker runs with iptables and its bridge turned off (/etc/docker/daemon.json), so it never
# loads the kernel's connection-tracking table on the box that opens 40,000+ connections.
#
# Grafana from the laptop:  ssh -L 3000:127.0.0.1:3000 rp-loadgen   then open http://localhost:3000

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    network_mode: host
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=60d
      - --web.listen-address=127.0.0.1:9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro # from templates/prometheus.yml.j2
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:12.1.0
    network_mode: host
    restart: unless-stopped
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3000"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /etc/grafana/secrets/grafana-admin-password
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/proxy-capacity.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./secrets/grafana-admin-password:/etc/grafana/secrets/grafana-admin-password:ro
      - grafana-data:/var/lib/grafana

  node-exporter:
    image: prom/node-exporter:v1.9.1
    network_mode: host
    pid: host
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --web.listen-address=127.0.0.1:9100
    volumes:
      - /:/host:ro,rslave

volumes:
  prometheus-data:
  grafana-data:
