# the results viewer: every saved run (results/<entry>/prometheus) in one grafana dashboard.
#
#   cd results && docker compose up --build      then open http://localhost:3000
#
# builds the exact same two images that northflank runs publicly, so this is a preview of the site.
# --build picks up new runs and dashboard edits (cached, takes a few seconds)

services:
  prometheus:
    build:
      context: ..
      dockerfile: results/prometheus.Dockerfile

  grafana:
    build:
      context: ..
      dockerfile: results/grafana.Dockerfile
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus]
