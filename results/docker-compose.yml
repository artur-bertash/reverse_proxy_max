# The results viewer: every saved run (results/<entry>/prometheus) in one Grafana dashboard.
#
#   cd results && docker compose up      then open http://localhost:3000
#
# Stock images, nothing to build. Prometheus copies every run's snapshot into one database at start
# (so the files in git are never changed) and scrapes nothing. Grafana uses the same dashboard and
# provisioning files as the live one on the load generator.

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./:/runs:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /tmp/db
        for snapshot in /runs/*/prometheus; do cp -r "$$snapshot"/. /tmp/db/; done
        echo 'global: {}' > /tmp/prometheus.yml
        exec /bin/prometheus --config.file=/tmp/prometheus.yml --storage.tsdb.path=/tmp/db \
          --storage.tsdb.retention.time=100y --web.listen-address=:9090

  grafana:
    image: grafana/grafana:12.1.0
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus]
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      GF_AUTH_ANONYMOUS_ENABLED: "true" # read-only, no login
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/proxy-capacity.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ../infra/roles/monitoring/files/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../infra/roles/monitoring/files/grafana/dashboards:/var/lib/grafana/dashboards:ro
