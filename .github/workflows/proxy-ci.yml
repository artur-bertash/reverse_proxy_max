name: proxy-ci

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CHALLENGE: third_party/twelve-dollar-server-challenge
  BACKEND: third_party/twelve-dollar-server-challenge/submissions/c-iouring-pavlyhalim

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: false

      - name: Installing tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends sqlite3 jq

      - name: Cache seed
        id: seed-cache
        uses: actions/cache@v4
        with:
          path: |
            third_party/twelve-dollar-server-challenge/seed/feed.db
            third_party/twelve-dollar-server-challenge/seed/tokens.json
          key: seed-${{ hashFiles('third_party/twelve-dollar-server-challenge/seed/generate.mjs', 'third_party/twelve-dollar-server-challenge/seed/make-seed.sh', 'third_party/twelve-dollar-server-challenge/schema.sql') }}

      - name: Generate seed
        if: steps.seed-cache.outputs.cache-hit != 'true'
        run: bash $CHALLENGE/seed/make-seed.sh

      - name: Install backend toolchain (C)
        run: sudo bash $BACKEND/install.sh

      - name: Build backend (opinionated to c-iouring-pavlyhalim, decision will be explained later)
        run: PGO=0 bash $BACKEND/build.sh

      - name: Start the backend on port 3000
        run: |
          cp $CHALLENGE/seed/feed.db $RUNNER_TEMP/feed.db
          SQLITE_PATH=$RUNNER_TEMP/feed.db JWT_SECRET=twelve-dollar-challenge HOST=127.0.0.1 PORT=3000 \
            nohup bash $BACKEND/start.sh > backend.log 2>&1 &
          curl -sf --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:3000/health

      - name: Start my proxy on port 9090
        run: |
          go build -o $RUNNER_TEMP/proxy proxy/*.go
          nohup $RUNNER_TEMP/proxy -from 127.0.0.1:9090 -to 127.0.0.1:3000 > proxy.log 2>&1 &
          curl -s -o /dev/null --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:9090/health

      - name: Run the 42 tests through the proxy
        run: bash $CHALLENGE/test/test.sh http://127.0.0.1:9090

      - name: Show logs if something failed
        if: failure()
        run: |
          echo "--- backend.log"; tail -30 backend.log || true
          echo "--- proxy.log";   tail -30 proxy.log || true
